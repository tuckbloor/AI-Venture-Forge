[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-app-server"
dynamic = ["version"]
description = "Self-hosted Python app framework with a built-in server administration panel"
readme = "ENGINE-README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["python", "self-hosted", "web-apps", "ai", "ui", "server"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<17",
  "cryptography>=43,<48",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3,<4"]
mysql = ["pymysql>=1,<2"]
mssql = ["pyodbc>=5,<6"]
windows-service = ["pywin32>=311; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
ai-app-server = "ai_app_server.cli:main"

[tool.setuptools.packages.find]
include = ["ai_app_server*"]

[tool.setuptools.package-data]
ai_app_server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "ai_app_server.version.__version__"}
