<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · AI App Server</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px system-ui,Segoe UI,sans-serif;background:#eef3fb;color:#182c4c}.card{width:min(92vw,400px);background:white;padding:34px;border-radius:18px;box-shadow:0 20px 60px #253b5c20}h1{margin:8px 0 6px;font-size:25px}p{color:#637494;line-height:1.6}label{display:block;margin:23px 0 8px;font-weight:650}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #bdcde5;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;background:#205bd5;border:0;border-radius:10px;padding:13px;color:white;font:inherit;font-weight:700;cursor:pointer}.err{color:#9c2439;margin:14px 0 0;min-height:20px}</style></head>
<body><main class="card"><div aria-hidden="true">🔒</div><h1>Application sign in</h1><p>Sign in with your application user account. Administrator accounts are managed separately.</p><form id="form"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="60"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="1"><button id="submit" type="submit">Open application</button><div id="error" class="err" role="alert"></div></form></main>
<script src="/static/app-login.js" defer></script></body></html>
