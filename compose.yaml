# PRIVATE demo deployment: localhost-only UI. Do not directly expose publicly.
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
  app:
    build: .
    command: ["python", "-m", "streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--browser.gatherUsageStats", "false"]
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - forge_data:/app/data
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - ollama
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "worker.py", "--poll-seconds", "20"]
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - forge_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
volumes:
  ollama_models:
  forge_data:
